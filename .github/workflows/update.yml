name: Update values
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-values.mjs
        env:
          RBLX_API_KEY: ${{ secrets.RBLX_API_KEY }}
      - run: |
          git config user.name "value-bot"
          git config user.email "bot@users.noreply.github.com"
          git add values.json
          git diff --cached --quiet || (git commit -m "Update values" && git push)
